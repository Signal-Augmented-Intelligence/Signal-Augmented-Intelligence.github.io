  title: "[모집 공고] SAI Lab(신호 증강지능 연구실) 학부연구생 모집"
  body: "이력서에 남길 공모전 수상 내역 한 줄보다, '인공지능(AI)의 본질을 이해하고 깊이 있게 탐구하고 싶은' 학생을 찾습니다.\n\n신호 증강지능 연구실(SAI Lab)은 단순히 기계적인 데이터 처리를 넘어, LLM 기반의 멀티미디어 신호 이해 및 추론, 그리고 궁극적으로 사람의 인지와 판단을 돕는 '증강 지능(Augmented Intelligence)'을 연구합니다. 화려한 겉보기 성과 이전에, AI가 왜 그리고 어떻게 작동하는지 그 밑바닥부터 진득하게 파고들 분을 환영합니다.\n\n■ 이런 분을 기다립니다\n- 당장의 스펙이나 수상보다, AI의 원리와 '문제 해결' 자체에 순수한 흥미가 있는 분\n- 남들이 만들어둔 코드를 돌려보는 것을 넘어, 그 이면의 구조와 수학적 의미를 깊게 고민하고 싶은 분\n- 기술이 어떻게 사람의 감각을 확장하고 지능을 증강할 수 있을지 탐구하고 싶은 분\n\n■ 주요 연구 분야\n- LLM 기반 멀티미디어 신호(음성, 비전, 텍스트 등) 이해 및 추론\n- 사람을 위한 증강 지능(Augmented Intelligence) 모델 연구\n- 딥러닝 기반 멀티모달 데이터 분석\n\n■ 지원 및 문의\n대상: 한신대학교 AISW대학 소속 2학년 ~ 3학년 1학기 학부생\n(단, 한신대학교 대학원 진학 희망자는 4학년을 포함하여 학년 제한 없이 지원 가능합니다.)\n\n절차: 이메일 지원 후, 서로의 연구 관심사와 참여 의지를 확인하는 간단한 사전 면담이 진행됩니다.\n\n문의: 김선만 교수 (이메일 smkim@hs.ac.kr 및 연구실 방문)\n\n단순한 경험을 넘어, '사람을 향하는 진짜 AI 연구'에 진지하게 몰입할 학생과 함께하고자 합니다."
